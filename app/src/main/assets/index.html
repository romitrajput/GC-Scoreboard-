<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121519">
<title>Gully Cricket Scorer</title>
<style>
:root{--bg:#121519;--card:#1b2027;--card2:#232a33;--line:#2e3742;--chalk:#f4f1e6;--mut:#8d98a5;--ball:#c8f03c;--blue:#4fb3ff;--red:#ff5a4e;--amber:#ffc23d;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--chalk);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
body{padding-bottom:env(safe-area-inset-bottom)}
#app{max-width:560px;margin:0 auto;padding:12px 12px 90px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);margin:22px 4px 10px;font-weight:700}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--chalk);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none}
input:focus{border-color:var(--ball)}
.muted{color:var(--mut)}.small{font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:13px 16px;font-weight:700;width:100%}
.btn.pri{background:var(--ball);color:#111;border-color:var(--ball)}
.btn.sm{width:auto;padding:10px 14px;font-size:14px;border-radius:12px}
.btn.danger{color:var(--red)}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.top{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px;gap:8px}
.top .t{font-weight:800;font-size:16px;text-align:center;flex:1}
.ib{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.brand{display:flex;align-items:center;gap:12px;margin:8px 4px 18px}
.brand h1{font-size:26px;line-height:1}.brand h1 span{color:var(--ball)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 12px;font-size:14px}
.chip button{width:22px;height:22px;border-radius:50%;background:#0003;font-size:14px;line-height:1}
.chip.pool{padding:6px 12px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-weight:700;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--chalk);color:#111}
.set{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);gap:12px}
.set:last-child{border-bottom:0}
.set .l b{display:block;font-weight:700}.set .l small{color:var(--mut)}
.step{display:flex;align-items:center;gap:6px}.step button{width:36px;height:36px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:18px;font-weight:700}.step span{min-width:30px;text-align:center;font-weight:800;font-size:18px}
.sw{position:relative;width:48px;height:28px;flex:0 0 auto}.sw input{opacity:0;width:0;height:0}.sw i{position:absolute;inset:0;background:var(--card2);border:1px solid var(--line);border-radius:99px;transition:.2s}.sw i:after{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:var(--mut);border-radius:50%;transition:.2s}.sw input:checked+i{background:var(--ball)}.sw input:checked+i:after{left:23px;background:#111}
.team{border-top:4px solid var(--ball)}.team.t1{border-top-color:var(--blue)}
.tname{font-weight:800;font-size:18px;background:transparent;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:4px 0}
.addrow{display:flex;gap:8px}.addrow input{flex:1}
/* live */
.hero{background:linear-gradient(135deg,#1f2a1a,#1b2027 60%);border:1px solid var(--line);border-radius:20px;padding:16px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;border:2px dashed #c8f03c22}
.hero .tm{font-weight:700;color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.1em}
.hero .sc{font-size:54px;font-weight:900;line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.hero .sc small{font-size:20px;color:var(--mut);font-weight:700;margin-left:8px}
.chase{font-size:14px;margin-top:6px}.chase b{color:var(--ball)}
.fh{margin-top:10px;background:var(--amber);color:#111;font-weight:800;border-radius:10px;padding:6px 10px;display:inline-block;font-size:13px;animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.6}}
.bats{margin-top:12px;display:grid;gap:6px}
.bat{display:flex;align-items:center;gap:8px;background:#0002;border-radius:12px;padding:9px 11px}
.bat .nm{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bat.on{background:#c8f03c1a;outline:1px solid #c8f03c55}
.bat .rb{font-variant-numeric:tabular-nums}.bat .rb b{font-size:18px}
.bat .x{font-size:11px;color:var(--mut);min-width:64px;text-align:right}
.bowl{display:flex;justify-content:space-between;margin-top:8px;font-size:14px;color:var(--mut)}.bowl b{color:var(--chalk)}
.over{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;min-height:34px;align-items:center}
.bl{min-width:34px;height:34px;padding:0 6px;border-radius:17px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--card2);border:1px solid var(--line)}
.bl.b4{background:var(--blue);color:#111;border:0}.bl.b6{background:var(--ball);color:#111;border:0}.bl.w{background:var(--red);color:#fff;border:0}.bl.x{background:#ffc23d26;color:var(--amber);border-color:#ffc23d55}
.bl.sm{min-width:26px;height:26px;font-size:11px;border-radius:13px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.pad button{height:62px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:24px;font-weight:900}
.pad button:active{transform:scale(.95);background:var(--card2)}
.pad .x{color:var(--amber);font-size:17px}.pad .w{background:var(--red);border-color:var(--red);color:#fff;font-size:18px}.pad .u{font-size:15px;color:var(--mut)}
.pad .k4{color:var(--blue)}.pad .k6{color:var(--ball)}
.tools{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.tools button{flex:0 0 auto;font-size:13px;font-weight:700;padding:9px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mut)}
.ovlog{font-size:13px;color:var(--mut);display:grid;gap:6px}
.ovlog div{display:flex;gap:4px;align-items:center;flex-wrap:wrap}.ovlog .on{min-width:44px;font-weight:700;color:var(--chalk)}
/* modal */
#modal{position:fixed;inset:0;z-index:20;display:none}
#modal.open{display:block}
#modal .bg{position:absolute;inset:0;background:#000a;animation:fade .2s}
#modal .sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;animation:up .22s ease-out;border-top:1px solid var(--line)}
@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes fade{from{opacity:0}}
.sheet h3{font-size:20px;margin-bottom:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.opt{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:13px 10px;font-weight:700;text-align:left;min-height:52px}
.opt small{display:block;color:var(--mut);font-weight:500;font-size:12px;margin-top:2px}
.opt.on{background:var(--chalk);color:#111;border-color:var(--chalk)}.opt.on small{color:#444}
.opt:disabled{opacity:.35}
.opts.n{grid-template-columns:repeat(4,1fr)}.opts.n .opt{text-align:center;font-size:20px}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--chalk);color:#111;font-weight:700;padding:11px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:30;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
/* tables */
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{color:var(--mut);font-weight:600;text-align:right;padding:6px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
td{padding:8px 4px;border-top:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
td .how{display:block;color:var(--mut);font-size:11px}
td b{font-size:14px}
.inh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.inh b{font-size:22px;font-weight:900}
.res{border-radius:18px;padding:16px;background:linear-gradient(120deg,var(--ball),#8fd14f);color:#111;margin-bottom:12px}
.res b{font-size:20px;display:block;font-weight:900}
.res.tie{background:linear-gradient(120deg,var(--amber),#ff9a3d)}
.mc{display:block;width:100%;text-align:left}
.mc .ln{display:flex;justify-content:space-between;font-weight:700;margin:3px 0}.mc .ln.win{color:var(--ball)}
.mc .rs{font-size:13px;color:var(--mut);margin-top:6px}
.tag{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--card2);color:var(--mut)}
.tag.live{background:var(--red);color:#fff}
/* day */
.dhero{border-radius:22px;padding:20px 18px;background:repeating-linear-gradient(-45deg,#ffffff05 0 10px,transparent 10px 20px),linear-gradient(160deg,#24341b,#16191e 70%);border:1px solid var(--line);position:relative;overflow:hidden}
.dhero .k{font-size:12px;font-weight:800;letter-spacing:.2em;color:var(--ball)}
.dhero h1{font-size:28px;margin:6px 0 14px;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#0003;border-radius:12px;padding:10px 6px;text-align:center}.stat b{display:block;font-size:22px;font-weight:900}.stat span{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.potd{margin-top:12px;border-radius:20px;padding:18px;background:linear-gradient(135deg,#ffc23d,#ff8a3d);color:#1a1205;position:relative;overflow:hidden}
.potd .k{font-size:11px;font-weight:900;letter-spacing:.2em}
.potd .n{font-size:30px;font-weight:900;margin:4px 0}
.potd .p{position:absolute;right:16px;top:16px;text-align:center;background:#1a120522;border-radius:14px;padding:8px 12px}.potd .p b{font-size:26px;display:block;line-height:1}
.aw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.awc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.awc .i{font-size:22px}.awc .t{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-top:4px}
.awc .n{font-weight:800;font-size:16px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.awc .v{color:var(--ball);font-weight:800;font-size:13px}
.daychips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.daychips button{flex:0 0 auto;padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--mut)}
.daychips button.on{background:var(--chalk);color:#111}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.rank{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--card2);font-size:11px;font-weight:800;margin-right:6px}
.rank.g{background:var(--amber);color:#111}
.empty{text-align:center;padding:40px 20px;color:var(--mut)}
.empty .e{font-size:44px}
.ib.mic{background:#ff5a4e22;border-color:#ff5a4e66}
.micpulse{font-size:40px;width:96px;height:96px;border-radius:50%;background:var(--red);display:grid;place-items:center;margin:6px auto 14px;animation:pulse .7s infinite alternate}
.cheat{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px;text-align:left;margin:12px 0}.cheat b{color:var(--ball)}
img.share{width:100%;border-radius:14px;margin:12px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<input type="file" id="imp" accept="application/json,.json" style="display:none" onchange="doImport(this)">
<script>
"use strict";
/* ================= storage ================= */
const KEY='gully-cricket-v1';
let S={matches:[],liveId:null,pool:[],lastSetup:null};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const fmtDay=(k,o)=>new Date(k+'T00:00').toLocaleDateString(undefined,o||{weekday:'long',day:'numeric',month:'short'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const getM=id=>S.matches.find(m=>m.id===id);
const ov=(b,bpo)=>Math.floor(b/bpo)+(b%bpo?'.'+(b%bpo):'');
const ovs=(b,bpo)=>Math.floor(b/bpo)+'.'+(b%bpo);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}

/* ================= router ================= */
let view={name:'home'},lastView='';
function go(name,p={},replace=false){view=Object.assign({name},p);try{history[replace?'replaceState':'pushState'](view,'')}catch(e){}render()}
window.addEventListener('popstate',e=>{closeModal();view=e.state||{name:'home'};render()});
function back(){if(history.length>1)history.back();else go('home',{},true)}

/* ================= modal ================= */
let modalLock=false;
function openModal(html,lock=false){modalLock=lock;const m=$('#modal');m.innerHTML=`<div class="bg" onclick="if(!modalLock)closeModal()"></div><div class="sheet">${html}</div>`;m.classList.add('open')}
function closeModal(){const m=$('#modal');m.classList.remove('open');m.innerHTML='';modalLock=false}
const modalOpen=()=>$('#modal').classList.contains('open');
let confirmCb=null;
function ask(title,msg,yes,cb,danger){confirmCb=cb;openModal(`<h3>${title}</h3><p class="muted">${msg}</p><div class="row" style="margin-top:16px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn ${danger?'danger':'pri'}" onclick="const f=confirmCb;closeModal();f&&f()">${yes}</button></div>`)}

/* ================= cricket engine ================= */
const newInn=bat=>({bat,bowl:1-bat,balls:[],s:null,ns:null,bw:null,closed:false});
const FIELD_HOW=['Caught','Run out','Stumped','One tip one hand'];
function howText(w,bowler,ft){const f=w.fld!=null?ft[w.fld]:null;
  switch(w.how){case 'Bowled':return 'b '+bowler;
  case 'Caught':return f?(f===bowler?'c & b '+bowler:'c '+f+' b '+bowler):'c ? b '+bowler;
  case 'Run out':return 'run out'+(f?' ('+f+')':'');
  case 'Stumped':return 'st '+(f||'?')+' b '+bowler;
  case 'Hit wicket':return 'hit wicket b '+bowler;
  case 'One tip one hand':return 'c '+(f?f+' ':'')+'(one-tip-one-hand) b '+bowler;
  case 'Hit out of bounds':return 'hit out of bounds b '+bowler;
  case 'Six & out':return 'six & out b '+bowler;}
  return w.how}
function calc(m,ii){
  const inn=m.innings[ii],c=m.config,BT=m.teams[inn.bat].players,WT=m.teams[inn.bowl].players;
  const bat=BT.map(n=>({name:n,r:0,b:0,f:0,s:0,out:false,how:'',in:false,ord:99}));
  const bowl=WT.map(n=>({name:n,lb:0,r:0,w:0,wd:0,nb:0,dots:0,ord:99}));
  let runs=0,wk=0,legal=0,ord=0,bord=0,cur=null;const ext={wd:0,nb:0,b:0,lb:0},overs=[],fow=[];
  const seen=i=>{if(i!=null&&bat[i]&&!bat[i].in){bat[i].in=true;bat[i].ord=ord++}};
  for(const e of inn.balls){
    seen(e.s);seen(e.ns);
    if(!cur){cur={bw:e.bw,balls:[],runs:0,w:0,legal:0};overs.push(cur)}
    const bw=bowl[e.bw];if(bw.ord===99)bw.ord=bord++;
    const t=e.runs+e.ex;runs+=t;cur.runs+=t;cur.balls.push(e);cur.bw=e.bw;
    const bt=bat[e.s];
    if(e.type!=='wd')bt.b++;
    bt.r+=e.runs;if(e.runs===4)bt.f++;if(e.runs===6)bt.s++;
    if(e.type)ext[e.type]+=e.ex;
    bw.r+=e.runs+((e.type==='wd'||e.type==='nb')?e.ex:0);
    if(e.type==='wd')bw.wd++;if(e.type==='nb')bw.nb++;
    if(e.legal){legal++;cur.legal++;bw.lb++;if(t===0)bw.dots++}
    if(e.w){wk++;cur.w++;const o=bat[e.w.out];o.out=true;o.how=howText(e.w,WT[e.bw],WT);if(e.w.how!=='Run out')bw.w++;fow.push({wk,runs,ball:legal,name:o.name})}
    if(e.legal&&legal%c.bpo===0)cur=null;
  }
  seen(inn.s);seen(inn.ns);
  const n=BT.length,maxWk=c.lms?n:n-1;
  return {inn,bat,bowl,runs,wk,legal,ext,overs,fow,maxWk,team:m.teams[inn.bat].name,bowlTeam:m.teams[inn.bowl].name};
}
function isFreeHit(m,ii){if(!m.config.freeHit)return false;const b=m.innings[ii].balls,e=b[b.length-1];if(!e)return false;return e.type==='nb'||(e.type==='wd'&&e.fh)}
function soloMode(m,k){const n=m.teams[k.inn.bat].players.length;return n===1||(m.config.lms&&k.wk>=n-1)}
function needOf(m){
  const ii=m.innings.length-1,inn=m.innings[ii],k=calc(m,ii);
  if(inn.s==null)return 's';
  if(inn.ns==null&&!soloMode(m,k))return 'ns';
  if(inn.bw==null)return 'bw';
  return null}
function prevOverBowler(m,k){let p=null;for(const o of k.overs)if(o.legal===m.config.bpo)p=o.bw;return p}
function addBall(m,{runs=0,type='',ran=0,w=null}){
  const ii=m.innings.length-1,inn=m.innings[ii],c=m.config;
  if(needOf(m))return;
  let ex=0,legal=true;
  if(type==='wd'){ex=c.wideRun+ran;legal=c.wideLegal}
  else if(type==='nb'){ex=c.nbRun;legal=c.nbLegal}
  else if(type==='b'||type==='lb')ex=ran;
  const fh=isFreeHit(m,ii);
  inn.balls.push({s:inn.s,ns:inn.ns,bw:inn.bw,runs,ex,type,legal,w,fh});
  const phys=(type==='wd'||type==='b'||type==='lb')?ran:((runs===4||runs===6)?0:runs);
  if(phys%2===1&&inn.ns!=null)[inn.s,inn.ns]=[inn.ns,inn.s];
  if(w){if(inn.s===w.out)inn.s=null;else if(inn.ns===w.out)inn.ns=null}
  let k=calc(m,ii);
  if(w&&soloMode(m,k)){if(inn.s==null){inn.s=inn.ns;inn.ns=null}else inn.ns=null}
  if(legal&&k.legal%c.bpo===0){if(inn.ns!=null)[inn.s,inn.ns]=[inn.ns,inn.s];inn.bw=null}
  if(navigator.vibrate)try{navigator.vibrate(w?[60,40,60]:20)}catch(e){}
  if(w)toast('OUT! '+k.bat[w.out].name+' — '+k.bat[w.out].how);
  else if(runs===6)toast('SIX! 💥');else if(runs===4)toast('FOUR! 🔥');
  if(legal&&k.legal%c.bpo===0&&k.legal<c.overs*c.bpo)setTimeout(()=>toast('End of over '+(k.legal/c.bpo)+' · '+k.runs+'/'+k.wk),w||runs>=4?1600:0);
  afterBall(m);save();render();
}
let pendingBreak=false;
function afterBall(m){
  const ii=m.innings.length-1,inn=m.innings[ii],c=m.config,k=calc(m,ii);
  const tgt=ii===1?calc(m,0).runs+1:null;
  if(inn.closed||k.legal>=c.overs*c.bpo||k.wk>=k.maxWk||(tgt!=null&&k.runs>=tgt)){
    if(ii===0){m.innings.push(newInn(inn.bowl));pendingBreak=true}
    else finish(m)}
}
function resultOf(m){
  const a=calc(m,0),b=calc(m,1),c=m.config;
  if(b.runs>a.runs){const wl=b.maxWk-b.wk,bl=c.overs*c.bpo-b.legal;return {winner:b.inn.bat,text:`${b.team} won by ${wl} wicket${wl===1?'':'s'}`+(bl>0?` (${bl} ball${bl===1?'':'s'} left)`:'')}}
  if(a.runs>b.runs){const d=a.runs-b.runs;return {winner:a.inn.bat,text:`${a.team} won by ${d} run${d===1?'':'s'}`}}
  return {winner:-1,text:'Match tied! 🤝'}}
function finish(m){m.status='done';m.result=resultOf(m);m.ended=Date.now();if(S.liveId===m.id)S.liveId=null;save();
  setTimeout(()=>{go('match',{id:m.id,fresh:1},true)},0)}
function undo(){
  const m=getM(view.id);if(!m)return;
  let ii=m.innings.length-1;
  if(m.status==='done'){m.status='live';delete m.result;S.liveId=m.id}
  if(m.innings[ii].balls.length===0&&ii===1){m.innings.pop();ii=0;pendingBreak=false}
  const inn=m.innings[ii];inn.closed=false;
  const e=inn.balls.pop();
  if(!e){toast('Nothing to undo');save();render();return}
  inn.s=e.s;inn.ns=e.ns;inn.bw=e.bw;save();closeModal();toast('Last ball undone');
  if(view.name!=='live')go('live',{id:m.id},true);else render();
}

const defCfg={six:'runs',overs:5,bpo:6,maxBowl:0,wideRun:1,wideLegal:false,nbRun:1,nbLegal:false,freeHit:true,lms:false};
let draft=null,poolT=0,focusAdd=null;
function newDraft(from){
  const src=from||S.lastSetup;
  draft={teams:src?src.teams.map(t=>({name:t.name,players:[...t.players]})):[{name:'Team A',players:[]},{name:'Team B',players:[]}],
    cfg:Object.assign({},defCfg,src?src.cfg:{}),batFirst:0,common:(src&&src.common)||''};
}
function addP(t){const i=$('#add'+t);const names=i.value.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
  if(!names.length)return;const all=new Set(draft.teams.flatMap(x=>x.players).map(x=>x.toLowerCase()));if(draft.common.trim())all.add(draft.common.trim().toLowerCase());let dup=0;
  for(const n of names){if(all.has(n.toLowerCase())){dup++;continue}draft.teams[t].players.push(n.slice(0,24));all.add(n.toLowerCase())}
  if(dup)toast('Skipped duplicate name');focusAdd=t;render()}
function rmP(t,i){draft.teams[t].players.splice(i,1);render()}
function poolAdd(i){draft.teams[poolT].players.push(S.pool[i]);render()}
function movP(t,i){const p=draft.teams[t].players.splice(i,1)[0];draft.teams[1-t].players.push(p);render()}
function shuffleTeams(){const all=draft.teams.flatMap(t=>t.players);if(all.length<2)return toast('Add some players first');
  for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]]}
  draft.teams[0].players=all.filter((_,i)=>i%2===0);draft.teams[1].players=all.filter((_,i)=>i%2===1);toast('Teams shuffled 🎲');render()}
function toss(){const w=Math.random()<.5?0:1;draft.batFirst=w;render();toast(`🪙 ${Math.random()<.5?'Heads':'Tails'}! ${draft.teams[w].name} won the toss & bat first`)}
function adj(k,d,min,max){draft.cfg[k]=Math.max(min,Math.min(max,draft.cfg[k]+d));render()}
function setC(k,v){draft.cfg[k]=v;render()}
function startMatch(){
  const d=draft;
  d.teams.forEach((t,i)=>{t.name=(t.name||'').trim()||('Team '+'AB'[i])});
  if(d.teams[0].name.toLowerCase()===d.teams[1].name.toLowerCase())return toast('Give the teams different names');
  const cm=(d.common||'').trim().slice(0,24);
  if(cm&&d.teams.some(t=>t.players.some(p=>p.toLowerCase()===cm.toLowerCase())))return toast(cm+' is already in a team — remove them there first');
  const teams=d.teams.map(t=>({name:t.name,players:[...t.players,...(cm?[cm]:[])]}));
  if(teams.some(t=>!t.players.length))return toast('Each team needs at least 1 player');
  const cfg=Object.assign({},d.cfg);
  if(teams.some(t=>t.players.length<2)&&!cfg.lms){cfg.lms=true;toast('Last man stands turned on (1-player team)')}
  const day=dayKey(Date.now());
  const m={id:uid(),created:Date.now(),day,no:S.matches.filter(x=>x.day===day).length+1,config:cfg,
    teams,common:cm||null,innings:[newInn(d.batFirst)],status:'live'};
  S.matches.push(m);S.liveId=m.id;
  const pool=new Map(S.pool.map(p=>[p.toLowerCase(),p]));teams.flatMap(t=>t.players).forEach(p=>pool.set(p.toLowerCase(),p));
  S.pool=[...pool.values()].slice(-80);S.lastSetup={teams:d.teams.map(t=>({name:t.name,players:[...t.players]})),cfg,common:cm};save();
  go('live',{id:m.id},true);
}

const LM=()=>getM(view.id);
const nm=(m,n)=>esc(n)+(m.common&&n===m.common?' 🤝':'');
function chip(e,sm){const c='bl'+(sm?' sm':'');
  if(e.w)return `<span class="${c} w">W${e.runs?'+'+e.runs:''}</span>`;
  if(e.type==='wd')return `<span class="${c} x">${e.ex>1?e.ex:''}wd</span>`;
  if(e.type==='nb')return `<span class="${c} x">nb${e.runs?'+'+e.runs:''}</span>`;
  if(e.type==='b'||e.type==='lb')return `<span class="${c} x">${e.ex}${e.type}</span>`;
  return `<span class="${c} ${e.runs===4?'b4':e.runs===6?'b6':''}">${e.runs===0?'•':e.runs}</span>`}
function vLive(m){
  const ii=m.innings.length-1,inn=m.innings[ii],c=m.config,k=calc(m,ii);
  const tgt=ii===1?calc(m,0).runs+1:null,left=c.overs*c.bpo-k.legal;

  else chase=`<div class="chase muted">${esc(k.bowlTeam)} bowling · ${c.overs} over innings${c.six==='out'?' · six = out':c.six==='runsout'?' · six = 6 + out':''}</div>`;

  const w=inn.bw!=null?k.bowl[inn.bw]:null;

  return `<div class="top"><button class="ib" onclick="go('home')">⌂</button><div class="t">Match ${m.no} · ${ii?'2nd':'1st'} inn</div><button class="ib mic" title="Voice scoring" onclick="startVoice()">🎤</button><button class="ib" title="Scorecard" onclick="go('match',{id:'${m.id}'})">📋</button></div>

    ${chase}<div class="small muted" style="margin-top:4px">CRR ${crr}${tgt?` · Target ${tgt}`:''} · Extras ${k.ext.wd+k.ext.nb+k.ext.b+k.ext.lb}</div>
    ${isFreeHit(m,ii)?'<div class="fh">⚡ FREE HIT — only run-out counts</div>':''}
    <div class="bats">${brow(inn.s,true)}${brow(inn.ns,false)}${inn.ns==null&&inn.s!=null&&soloMode(m,k)?'<div class="small muted" style="padding:2px 4px">Last man standing — batting alone</div>':''}</div>
    <div class="bowl"><span>🎯 ${w?`<b>${esc(w.name)}</b>`:'—'}</span><span>${w?`<b>${ov(w.lb,c.bpo)}-${w.r}-${w.w}</b> <span class="small">(O-R-W)</span>`:''}</span></div>
    <div class="over"><span class="small muted" style="margin-right:2px">This over</span>${curOver?curOver.balls.map(e=>chip(e)).join(''):'<span class="small muted">new over</span>'}</div>
  </div>

    <button onclick="tap(0)">0</button><button onclick="tap(1)">1</button><button onclick="tap(2)">2</button><button onclick="tap(3)">3</button>
    <button class="k4" onclick="tap(4)">4</button><button class="k6" onclick="tap(6)">${(c.six||'runs')==='runs'||isFreeHit(m,ii)?'6':`6<small style="display:block;font-size:10px;color:var(--red);font-weight:800;margin-top:-4px">${c.six==='out'?'OUT':'+ OUT'}</small>`}</button><button class="x" onclick="openExtra('wd')">WIDE</button><button class="x" onclick="openExtra('nb')">NO BALL</button>
    <button class="x" onclick="openExtra('b')">BYE</button><button class="x" onclick="openExtra('lb')">LEG BYE</button><button class="w" onclick="openWicket()">OUT</button><button class="u" onclick="undo()">↶ UNDO</button>

function scoreRuns(m,n){

function parseVoice(raw){
  const t=' '+String(raw).toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()+' ';

  let re;
  if(/ (undo|cancel|galat|wrong|mistake) /.test(t))return {k:'undo'};
  if(/swap|change strike|strike change|rotate/.test(t))return {k:'swap'};
  if(/ no runs? | dot ball /.test(t))return {k:'run',n:0};
  if((re=/leg ?(bye|byes|by|bi|bai)/).test(t))return {k:'lb',n:after(re)||1};
  if((re=/no ?ball|know ball|noble|nobel/).test(t))return {k:'nb',n:after(re)??0};
  if((re=/ (wide|wides|white|wild|wied|vide) /).test(t))return {k:'wd',n:after(re)??0};
  if((re=/ (bye|byes|bai|by) /).test(t))return {k:'b',n:after(re)||1};
  if(/run ?out|ran out|ranout/.test(t))return {k:'out',how:'Run out'};
  if(/one tip|one hand|ek tip/.test(t))return {k:'out',how:'One tip one hand'};
  if(/out of bound|over the wall|outside|ghar me|house/.test(t))return {k:'out',how:'Hit out of bounds'};
  if(/hit wicket/.test(t))return {k:'out',how:'Hit wicket'};
  if(/stump/.test(t))return {k:'out',how:'Stumped'};
  if(/ (bowled|bold|bolled|clean bowled) /.test(t))return {k:'out',how:'Bowled'};
  if(/caught|catch| cot | kaught/.test(t))return {k:'out',how:'Caught'};

function aggregate(list){

function seasonList(){const cut=seasonRange==='all'?'':dayKey(Date.now()-(seasonRange==='7'?6:29)*864e5);return S.matches.filter(m=>m.status==='done'&&m.day>=cut)}
function records(list){
  const R={};const up=(k,v,o,gt)=>{if(!R[k]||(gt?v>R[k].v:v<R[k].v))R[k]=Object.assign({v},o)};
  for(const m of list){const c=m.config;const dd=fmtDay(m.day,{day:'numeric',month:'short'})+' · M'+m.no;
    m.innings.forEach((inn,ii)=>{const k=calc(m,ii),d=dd;
    up('hiT',k.runs,{who:k.team,txt:`${k.runs}/${k.wk} (${ovs(k.legal,c.bpo)})`,d},1);
    if(ii===0||k.wk>=k.maxWk)up('loT',k.runs,{who:k.team,txt:`${k.runs}/${k.wk} (${ovs(k.legal,c.bpo)})`,d},0);
    k.bat.forEach(b=>{if(!b.in)return;up('hs',b.r*1000-b.b,{who:b.name,txt:`${b.r}${b.out?'':'*'} (${b.b} balls)`,d},1);if(b.s)up('six',b.s,{who:b.name,txt:`${b.s} six${b.s>1?'es':''} in an innings`,d},1);
      if(b.b>=5)up('sr',b.r/b.b,{who:b.name,txt:`SR ${(b.r/b.b*100).toFixed(0)} (${b.r} off ${b.b})`,d},1)});
    k.bowl.forEach(w=>{if(w.w)up('bb',w.w*1000-w.r,{who:w.name,txt:`${w.w}/${w.r} (${ovs(w.lb,c.bpo)} ov)`,d},1)});

  const todays=S.matches.filter(m=>m.day===today&&m.status==='done').sort((a,b)=>b.no-a.no);
  const past=[...new Set(S.matches.filter(m=>m.day!==today&&m.status==='done').map(m=>m.day))].sort().reverse();
  return `<div class="brand"><svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="#c8f03c"/><path d="M8 12c6 5 6 15 0 20M36 12c-6 5-6 15 0 20" stroke="#fff" stroke-width="2.5" fill="none" opacity=".9"/></svg><div><h1>GULLY<span>SCORER</span></h1><div class="small muted">No more “was that out?” arguments</div></div></div>
  ${live&&live.status==='live'?`<h2>Live now</h2>${matchCard(live)}`:''}
  <button class="btn pri" style="padding:18px;font-size:18px" onclick="newMatch()">＋ New match</button>
  <h2>Today · ${fmtDay(today,{weekday:'short',day:'numeric',month:'short'})}</h2>
  ${todays.length?`<button class="card mc" onclick="go('day',{day:'${today}'})" style="background:linear-gradient(120deg,#24341b,#1b2027);border-color:#c8f03c44"><b style="font-size:17px">🏆 Today's scoreboard</b><div class="small muted" style="margin-top:4px">Awards, player of the day, leaderboards & charts for ${todays.length} match${todays.length>1?'es':''}</div></button>${todays.map(m=>matchCard(m)).join('')}`:'<div class="card muted small">No matches finished today yet. Every match you score is saved automatically.</div>'}
  ${S.matches.some(m=>m.status==='done')?`<button class="card mc" onclick="go('season')"><b style="font-size:17px">📈 Season stats & records</b><div class="small muted" style="margin-top:4px">All-time leaderboards, records, player profiles</div></button>`:''}
  ${past.length?`<h2>Previous days</h2>${past.map(d=>{const n=S.matches.filter(m=>m.day===d&&m.status==='done').length;return `<button class="card mc row" onclick="go('day',{day:'${d}'})"><span><b>${fmtDay(d)}</b><div class="small muted">${n} match${n>1?'es':''}</div></span><span style="flex:0;color:var(--mut)">›</span></button>`}).join('')}`:''}
  <h2>Data</h2><div class="row"><button class="btn sm" style="flex:1" onclick="doExport()">⬇ Backup</button><button class="btn sm" style="flex:1" onclick="$('#imp').click()">⬆ Restore</button></div>`}
function doExport(){const t=JSON.stringify({app:'gully-scorer',v:1,matches:S.matches,pool:S.pool});
  if(window.AndroidBridge&&AndroidBridge.shareText){AndroidBridge.shareText(t,'gully-backup-'+dayKey(Date.now())+'.json');return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download='gully-backup-'+dayKey(Date.now())+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup downloaded')}
function doImport(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.matches))throw 0;
  const ids=new Set(S.matches.map(m=>m.id));let n=0;d.matches.forEach(m=>{if(!ids.has(m.id)){S.matches.push(m);n++}});(d.pool||[]).forEach(p=>{if(!S.pool.includes(p))S.pool.push(p)});save();toast(`Restored ${n} match${n===1?'':'es'}`);render()}catch(e){toast('Not a valid backup file')}inp.value=''};r.readAsText(f)}

/* ================= render ================= */
function render(){
  const a=$('#app'),v=view.name;let html;
  if(v==='setup'){if(!draft)newDraft();html=vSetup()}
  else if(v==='live'){const m=getM(view.id);if(!m){go('home',{},true);return}if(m.status==='done'){go('match',{id:m.id},true);return}html=vLive(m)}
  else if(v==='match'){const m=getM(view.id);if(!m){go('home',{},true);return}html=vMatch(m)}
  else if(v==='day')html=vDay(view.day||dayKey(Date.now()));
  else if(v==='season')html=vSeason();
  else html=vHome();
  a.innerHTML=html;
  const key=v+(view.id||'')+(view.day||'');if(key!==lastView){window.scrollTo(0,0);lastView=key}
  if(focusAdd!=null){const i=$('#add'+focusAdd);if(i)i.focus();focusAdd=null}
  if(v==='live')queueNeeds(getM(view.id));
}
try{history.replaceState(view,'')}catch(e){}
if(S.liveId&&getM(S.liveId)&&getM(S.liveId).status==='live'){view={name:'home'}}
render();
</script>
</body>
</html>
