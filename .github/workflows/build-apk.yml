name: Build APK

# Runs on every push to main (including uploading a new GullyCricket.zip on github.com),
# and on demand from Actions → Build APK → Run workflow.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Choose source (GullyCricket.zip if present, else repo files)
        id: src
        run: |
          if [ -f GullyCricket.zip ]; then
            echo "📦 Building from GullyCricket.zip"
            unzip -q -o GullyCricket.zip -d "$RUNNER_TEMP/src"
            DIR="$(dirname "$(find "$RUNNER_TEMP/src" -maxdepth 3 -name settings.gradle | head -1)")"
          else
            echo "📁 Building from repository files"
            DIR="$GITHUB_WORKSPACE"
          fi
          [ -f "$DIR/settings.gradle" ] || { echo "❌ settings.gradle not found"; exit 1; }
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/GullyScorer.apk"

      - name: Upload APK to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: GullyScorer-apk
          path: GullyScorer.apk

      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gully Scorer build ${{ github.run_number }}
          make_latest: true
          body: |
            📲 Tap **GullyScorer.apk** below to download, then open it on your Android phone.
            Installs over the previous version — saved matches are kept.
            Version 1.2.${{ github.run_number }} · commit ${{ github.sha }}
          files: GullyScorer.apk
