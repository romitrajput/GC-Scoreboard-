name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unpack GullyCricket.zip
        id: src
        run: |
          if [ -f GullyCricket.zip ]; then
            unzip -q -o GullyCricket.zip -d "$RUNNER_TEMP/src"
            DIR="$(dirname "$(find "$RUNNER_TEMP/src" -maxdepth 3 -name settings.gradle | head -1)")"
          else
            DIR="$GITHUB_WORKSPACE"
          fi
          [ -f "$DIR/settings.gradle" ] || { echo "settings.gradle not found"; exit 1; }
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/GullyScorer.apk"

      - name: Upload APK to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: GullyScorer-apk
          path: GullyScorer.apk

      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gully Scorer build ${{ github.run_number }}
          make_latest: true
          body: Tap GullyScorer.apk below to download and install on Android.
          files: GullyScorer.apk
